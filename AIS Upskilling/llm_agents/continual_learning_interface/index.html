<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #FFFFFF;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        .main-chat-area {
            width: 70%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #E0E0E0;
            overflow: hidden;
        }

        .environment-selector {
            padding: 16px 20px;
            border-bottom: 1px solid #E0E0E0;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FFFFFF;
        }

        .environment-label {
            font-size: 14px;
            font-weight: 500;
            color: #666666;
        }

        .environment-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: #FFFFFF;
            outline: none;
            cursor: pointer;
        }

        .environment-select:focus {
            border-color: #007AFF;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .retrieval-display {
            flex: 0 0 300px;
            background: #FFFFFF;
            border-top: 2px solid #E0E0E0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .retrieval-header {
            padding: 8px 12px;
            background: #F5F5F5;
            border-bottom: 1px solid #E0E0E0;
            font-weight: 600;
            font-size: 12px;
            color: #666666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .retrieval-loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #CCCCCC;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .retrieval-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-size: 11px;
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .retrieval-prompt {
            margin-bottom: 8px;
            padding: 8px;
            background: #F8F8F8;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .retrieval-response {
            margin-bottom: 8px;
            padding: 8px;
            background: #E8F4FD;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .retrieval-memories {
            margin-top: 8px;
            padding: 8px;
            background: #FFF9E6;
            border-radius: 4px;
            font-size: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-bubble {
            background: #007AFF;
            color: white;
        }

        .message.assistant .message-bubble {
            background: #F0F0F0;
            color: #000000;
        }

        .message.retrieval .message-bubble {
            background: #154e4e;
            color: #000000;
            border-left: 4px solid #FFD700;
        }

        .tool-call {
            background: #FFF9E6;
            border-left: 3px solid #FFB800;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
        }

        .tool-call-header {
            font-weight: 600;
            color: #FFB800;
            margin-bottom: 8px;
        }

        .tool-call-name {
            color: #000000;
            font-weight: 600;
        }

        .tool-call-args {
            margin-top: 8px;
            color: #666666;
            white-space: pre-wrap;
        }

        .tool-result {
            background: #E8F5E9;
            border-left: 3px solid #4CAF50;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
        }

        .tool-result-header {
            font-weight: 600;
            color: #4CAF50;
            margin-bottom: 8px;
        }

        .tool-result-content {
            color: #000000;
            white-space: pre-wrap;
        }

        .reasoning {
            background: #F5F5F5;
            border-left: 3px solid #9E9E9E;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 8px 0;
            font-size: 13px;
            color: #666666;
        }

        .reasoning-header {
            font-weight: 600;
            color: #000000;
            margin-bottom: 8px;
        }

        .input-container {
            flex-shrink: 0;
            padding: 20px;
            background: #FFFFFF;
            border-top: 1px solid #E0E0E0;
        }

        .right-sidebar {
            width: 30%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .maze-top-container {
            display: none !important;
            flex-direction: row;
            gap: 8px;
            padding: 20px;
            border-bottom: 1px solid #E0E0E0;
            min-height: 0;
            flex: 0 0 250px;
            max-height: 250px;
        }

        .maze-top-container.visible {
            display: flex !important;
        }

        .maze-config {
            display: none !important;
        }

        .maze-top-container .maze-config.visible {
            display: flex !important;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding: 0;
            border: none;
            border-bottom: none;
        }

        .maze-config-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        .maze-config .sidebar-label {
            font-size: 14px;
            margin-bottom: 8px;
            padding-bottom: 8px;
        }

        .maze-visualization .sidebar-label {
            font-size: 14px;
            margin-bottom: 8px;
            padding-bottom: 8px;
        }

        .maze-config-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .maze-config-row label {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }

        .maze-config-row input {
            padding: 6px 8px;
            border: 1px solid #E0E0E0;
            border-radius: 4px;
            font-size: 14px;
        }

        .maze-regenerate-button {
            padding: 8px 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            margin-top: 4px;
        }

        .maze-regenerate-button:hover {
            background: #1976D2;
        }

        .maze-visualization {
            display: none !important;
        }

        .maze-top-container .maze-visualization.visible {
            display: flex !important;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            padding: 0;
            border: none;
            border-bottom: none;
        }

        .maze-grid-container {
            flex: 1;
            overflow: auto;
            min-height: 150px;
            position: relative;
        }

        .maze-grid {
            position: relative;
            min-height: 200px;
            padding: 8px;
            background: #F8F8F8;
            border-radius: 8px;
            max-width: 100%;
        }

        .maze-cell {
            width: 50px;
            height: 50px;
            border: 1.5px solid #E0E0E0;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            font-weight: 600;
            background: #FFFFFF;
            position: absolute;
        }

        .maze-cell.empty {
            border: none;
            background: transparent;
        }

        .maze-cell.visited {
            background: #E8F5E9;
        }

        .maze-cell.current {
            background: #BBDEFB;
            border-color: #2196F3;
        }

        .maze-cell-label {
            position: absolute;
            top: 1px;
            left: 3px;
            font-size: 7px;
            color: #666666;
        }

        .maze-cell-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 8px;
        }

        .maze-cell-agent {
            color: #2196F3;
            font-weight: 700;
            font-size: 10px;
        }

        .maze-cell-item {
            color: #FF9800;
            font-size: 7px;
        }

        .sidebar-section {
            flex: 1.5;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid #E0E0E0;
            overflow: hidden;
            min-height: 0;
        }

        .sidebar-section:last-child {
            border-bottom: none;
        }

        .sidebar-label {
            font-size: 18px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #E0E0E0;
        }

        .advice-input-container {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid #E0E0E0;
        }

        .advice-input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .advice-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #E0E0E0;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #FFFFFF;
        }

        .advice-input:focus {
            border-color: #007AFF;
        }

        .advice-send-button {
            padding: 10px 20px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .advice-send-button:hover {
            background: #0056CC;
        }

        .advice-send-button:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .advice-messages-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            margin-bottom: 16px;
        }

        .advice-message-box {
            width: 100%;
            padding: 12px 16px;
            background: #F8F8F8;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            color: #000000;
            position: relative;
        }

        .memory-message-box {
            width: 100%;
            padding: 12px 16px;
            background: #F8F8F8;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 14px;
            color: #000000;
            position: relative;
        }

        .add-to-memory-btn, .remove-from-memory-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 500;
        }

        .add-to-memory-btn {
            background: #4CAF50;
            color: white;
        }

        .add-to-memory-btn:hover {
            background: #45a049;
        }

        .remove-from-memory-btn {
            background: #f44336;
            color: white;
        }

        .remove-from-memory-btn:hover {
            background: #da190b;
        }

        .message.advice .message-bubble {
            background: #E8F4FD;
            color: #000000;
            border-left: 3px solid #007AFF;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            max-width: 100%;
        }

        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #E0E0E0;
            border-radius: 24px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            background: #FFFFFF;
        }

        .message-input:focus {
            border-color: #007AFF;
        }

        .send-button {
            padding: 14px 28px;
            background: #007AFF;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .send-button:hover {
            background: #0056CC;
        }

        .send-button:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .env-reset-button {
            padding: 14px 20px;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .env-reset-button:hover {
            background: #E55A2B;
        }

        .env-reset-button:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
        }

        .confirmation-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .env-switch-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .confirmation-dialog {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .confirmation-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000000;
        }

        .confirmation-message {
            margin-bottom: 20px;
            color: #666666;
            line-height: 1.5;
        }

        .confirmation-tool-info {
            background: #F5F5F5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }

        .confirmation-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .confirmation-button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .confirmation-button.approve {
            background: #4CAF50;
            color: white;
        }

        .confirmation-button.approve:hover {
            background: #45A049;
        }

        .confirmation-button.cancel {
            background: #F5F5F5;
            color: #000000;
        }

        .confirmation-button.cancel:hover {
            background: #E0E0E0;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #CCCCCC;
            border-top-color: #007AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="main-chat-area">
        <div class="environment-selector">
            <span class="environment-label">Environment:</span>
            <select class="environment-select" id="environmentSelect"></select>
        </div>
        <div class="chat-container" id="chatContainer"></div>
        
        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    class="message-input" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    autocomplete="off"
                />
                <button class="send-button" id="sendButton">Send</button>
                <button class="env-reset-button" id="envResetButton">Env-only reset</button>
            </div>
        </div>
        
        <div class="retrieval-display" id="retrievalDisplay">
            <div class="retrieval-header" id="retrievalHeader">
                <span>Retrieval Model (gpt-5-nano)</span>
                <span class="retrieval-loading" id="retrievalLoading" style="display: none;"></span>
                <span id="retrievalStatus"></span>
            </div>
            <div class="retrieval-content" id="retrievalContent"></div>
        </div>
    </div>

    <div class="right-sidebar">
        <div class="maze-top-container" id="mazeTopContainer">
            <div class="sidebar-section maze-config" id="mazeConfig">
                <div class="sidebar-label">Maze Config</div>
                <div class="maze-config-content">
                    <div class="maze-config-row">
                        <label for="numRoomsInput">Rooms:</label>
                        <input type="number" id="numRoomsInput" min="3" max="50" value="3" />
                    </div>
                    <div class="maze-config-row">
                        <label for="seedInput">Seed:</label>
                        <input type="number" id="seedInput" placeholder="Random" />
                    </div>
                    <button class="maze-regenerate-button" id="mazeRegenerateButton">Generate</button>
                </div>
            </div>
            <div class="sidebar-section maze-visualization" id="mazeVisualization">
                <div class="sidebar-label">Maze</div>
                <div class="maze-grid-container" id="mazeGridContainer"></div>
            </div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-label">Memory</div>
            <div id="memoryContent" style="flex: 1; overflow-y: auto; min-height: 0;"></div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-label">Give advice</div>
            <div class="advice-messages-container" id="adviceMessagesContainer"></div>
            <div class="advice-input-container">
                <div class="advice-input-wrapper">
                    <input 
                        type="text" 
                        class="advice-input" 
                        id="adviceInput" 
                        placeholder="Type advice message..."
                        autocomplete="off"
                    />
                    <button class="advice-send-button" id="adviceSendButton">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const envResetButton = document.getElementById('envResetButton');
        const adviceInput = document.getElementById('adviceInput');
        const adviceSendButton = document.getElementById('adviceSendButton');
        const adviceMessagesContainer = document.getElementById('adviceMessagesContainer');
        const environmentSelect = document.getElementById('environmentSelect');
        const mazeVisualization = document.getElementById('mazeVisualization');
        const mazeGridContainer = document.getElementById('mazeGridContainer');
        const mazeConfig = document.getElementById('mazeConfig');
        const numRoomsInput = document.getElementById('numRoomsInput');
        const seedInput = document.getElementById('seedInput');
        const mazeRegenerateButton = document.getElementById('mazeRegenerateButton');
        const memoryContent = document.getElementById('memoryContent');
        const retrievalDisplay = document.getElementById('retrievalDisplay');
        const retrievalContent = document.getElementById('retrievalContent');
        const retrievalLoading = document.getElementById('retrievalLoading');
        const retrievalStatus = document.getElementById('retrievalStatus');
        
        const API_PORT = 8080;
        const API_BASE = `http://localhost:${API_PORT}`;
        
        let chatId = 'default';
        let pendingConfirmation = null;
        let adviceMessages = [];
        let currentEnvironment = 'maze';
        let availableEnvironments = [];
        let mazeStateInterval = null;
        let retrievalEntryCounter = 0; // Counter for numbering retrieval entries
        let waitingForMazeGeneration = false; // Flag to track if we're waiting for maze generation after reset
        
        // AbortController for cancelling ongoing agent/retrieval requests
        let currentRequestController = null;
        
        function abortOngoingRequests() {
            if (currentRequestController) {
                currentRequestController.abort();
                currentRequestController = null;
            }
        }
        
        function createNewRequestController() {
            abortOngoingRequests();
            currentRequestController = new AbortController();
            return currentRequestController;
        }

        function getMemoryList() {
            const memoryBoxes = memoryContent.querySelectorAll('.memory-message-box');
            const memoryList = [];
            memoryBoxes.forEach(box => {
                const textDiv = box.querySelector('div');
                if (textDiv) {
                    memoryList.push(textDiv.textContent.trim());
                }
            });
            return memoryList;
        }

        async function updateMemoryOnServer() {
            try {
                await fetch(`${API_BASE}/update_memory`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        memory: getMemoryList()
                    })
                });
            } catch (error) {
                console.error('Error updating memory on server:', error);
            }
        }

        function displayRetrieval(step) {
            // Increment counter for this retrieval entry
            retrievalEntryCounter++;
            
            const container = document.createElement('div');
            container.style.marginBottom = '12px';
            container.style.borderBottom = '1px solid #E0E0E0';
            container.style.paddingBottom = '12px';
            
            // Add entry number header
            const entryHeader = document.createElement('div');
            entryHeader.style.fontWeight = 'bold';
            entryHeader.style.fontSize = '14px';
            entryHeader.style.marginBottom = '8px';
            entryHeader.style.color = '#1976D2';
            entryHeader.textContent = `Retrieval Entry #${retrievalEntryCounter}`;
            container.appendChild(entryHeader);
            
            if (step.system_prompt) {
                const systemPromptDiv = document.createElement('div');
                systemPromptDiv.className = 'retrieval-prompt';
                systemPromptDiv.style.background = '#F0F0F0';
                systemPromptDiv.style.marginBottom = '8px';
                systemPromptDiv.textContent = `System Prompt:\n${step.system_prompt}`;
                container.appendChild(systemPromptDiv);
            }
            
            if (step.prompt) {
                const promptDiv = document.createElement('div');
                promptDiv.className = 'retrieval-prompt';
                promptDiv.textContent = `Prompt:\n${step.prompt}`;
                container.appendChild(promptDiv);
            }
            
            if (step.response) {
                const responseDiv = document.createElement('div');
                responseDiv.className = 'retrieval-response';
                responseDiv.textContent = `Response:\n${step.response}`;
                container.appendChild(responseDiv);
            }
            
            if (step.retrieved_memories && step.retrieved_memories.length > 0) {
                const memoriesDiv = document.createElement('div');
                memoriesDiv.className = 'retrieval-memories';
                const memText = step.retrieved_memories.map(m => 
                    `Memory ${m.number}: ${m.context || '(no context)'}`
                ).join('\n');
                memoriesDiv.textContent = `Retrieved:\n${memText}`;
                container.appendChild(memoriesDiv);

        function addRetrievalMessage(step) {
            if (!step.retrieved_memories || step.retrieved_memories.length === 0) {
                return;
            }
            
            const memoryList = getMemoryList();
            const memoryContextParts = [];
            
            for (const memItem of step.retrieved_memories) {
                const memNum = memItem.number || 0;
                const memContext = memItem.context || '';
                if (1 <= memNum && memNum <= memoryList.length) {
                    const memText = memoryList[memNum - 1];
                    if (memContext) {
                        memoryContextParts.push(`Memory ${memNum}: ${memText}\nContext: ${memContext}`);
                    } else {
                        memoryContextParts.push(`Memory ${memNum}: ${memText}`);
                    }
                }
            }
            
            if (memoryContextParts.length > 0) {
                const memoryContext = `Relevant memories retrieved:\n${memoryContextParts.join('\n\n')}`;
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message retrieval';
                
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = memoryContext;

                chatContainer.scrollTop = chatContainer.scrollHeight;

            const message = adviceInput.value.trim();

            // Clear input

            // Send to chat as user message (with advice styling)
            addMessage('user', message, true);
            setLoading(true);
            
            // Create new AbortController for this request
            const controller = createNewRequestController();
            
            let modelName = 'Model';
            let loadingMessage = null;
            
            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        chat_id: chatId,
                        memory: getMemoryList()
                    }),
                    signal: controller.signal
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    if (controller.signal.aborted) {
                        reader.cancel();
                        break;
                    }
                    
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (controller.signal.aborted) break;
                        
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                
                                if (data.type === 'model_info') {
                                    modelName = data.model;

                                    retrievalLoading.style.display = 'inline-block';

                                    }

                                    if (modelName && !loadingMessage) {
                                        loadingMessage = addLoadingMessage(modelName);

                                    if (data.content) {
                                        addMessage('assistant', data.content);
                                    }
                                    data.tool_calls.forEach(toolCall => {
                                        addToolCall(toolCall);
                                    });
                                } else if (data.type === 'tool_result') {
                                    addToolResult(data);
                                } else if (data.type === 'assistant_message') {
                                    if (modelName && !loadingMessage) {
                                        loadingMessage = addLoadingMessage(modelName);
                                    }
                                    removeLoadingMessage();
                                    addMessage('assistant', data.content);
                                } else if (data.type === 'reasoning') {
                                    addReasoning(data);
                                } else if (data.type === 'needs_confirmation') {
                                    removeLoadingMessage();
                                    pendingConfirmation = data.confirmation_tool_call;
                                    showConfirmationModal(data.confirmation_tool_call);
                                    return;
                                } else if (data.type === 'done') {
                                    removeLoadingMessage();
                                } else if (data.type === 'error') {
                                    removeLoadingMessage();
                                    addMessage('assistant', `Error: ${data.error}`);
                                }
                            } catch (e) {

        async function performEnvReset() {
            if (waitingForMazeGeneration) {
                return; // Already in reset state
            }

            // === STEP 1: Abort any ongoing agent/retrieval requests ===
            abortOngoingRequests();
            console.log('Aborted ongoing requests');
            
            // === STEP 2: Clean up any loading UI state ===
            removeLoadingMessage();
            setLoading(false);
            retrievalLoading.style.display = 'none';
            retrievalStatus.textContent = '';

            try {
                // === STEP 3: Call backend to reset environment and conversation ===
                // Memory is preserved on the backend
                const response = await fetch(`${API_BASE}/env_reset`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId
                    })
                });

                const data = await response.json();
                if (!data.success) {
                    alert('Failed to reset environment: ' + (data.error || 'Unknown error'));
                    return;
                }

                // === STEP 4: Clear all frontend UI displays ===
                chatContainer.innerHTML = '';
                retrievalContent.innerHTML = '';
                retrievalEntryCounter = 0;
                adviceMessagesContainer.innerHTML = '';
                adviceMessages = [];
                pendingConfirmation = null;
                
                // Clear maze visualization but keep config visible for regeneration
                if (currentEnvironment === 'maze') {
                    mazeGridContainer.innerHTML = '';
                    mazeVisualization.classList.remove('visible');
                    const mazeTopContainer = document.getElementById('mazeTopContainer');
                    if (mazeTopContainer) {
                        mazeTopContainer.classList.add('visible');
                    }
                    mazeConfig.classList.add('visible');
                }
                
                // === STEP 5: Lock inputs until maze is generated ===
                waitingForMazeGeneration = true;
                setInputsEnabled(false);
                
                // === STEP 6: Show prompt message ===
                addMessage('system', 'Environment reset. Please generate a new maze using the Maze Config panel before continuing.');
                
                console.log('Environment reset completed. Conversation and transcript cleared on backend.');
            } catch (error) {
                console.error('Error resetting environment:', error);
                alert('Failed to reset environment');
            }
        }

        function showEnvironmentSwitchModal(newEnvId, newEnvName) {
            const modal = document.createElement('div');
            modal.className = 'env-switch-modal';
            modal.id = 'envSwitchModal';
            
            const dialog = document.createElement('div');
            dialog.className = 'confirmation-dialog';
            
            const title = document.createElement('div');
            title.className = 'confirmation-title';
            title.textContent = 'Switch Environment?';
            
            const message = document.createElement('div');
            message.className = 'confirmation-message';
            message.textContent = `Switching to "${newEnvName}" will reset your current conversation. All previous messages will be lost. Do you want to continue?`;
            
            const buttons = document.createElement('div');
            buttons.className = 'confirmation-buttons';
            
            const cancelButton = document.createElement('button');
            cancelButton.className = 'confirmation-button cancel';
            cancelButton.textContent = 'Cancel';
            cancelButton.onclick = () => {
                document.getElementById('envSwitchModal').remove();
                // Reset dropdown to current environment
                environmentSelect.value = currentEnvironment;
            };
            
            const confirmButton = document.createElement('button');
            confirmButton.className = 'confirmation-button approve';
            confirmButton.textContent = 'Switch';
            confirmButton.onclick = () => switchEnvironment(newEnvId);
            
            buttons.appendChild(cancelButton);
            buttons.appendChild(confirmButton);
            
            dialog.appendChild(title);
            dialog.appendChild(message);
            dialog.appendChild(buttons);
            modal.appendChild(dialog);
            
            document.body.appendChild(modal);
        }

        async function switchEnvironment(envId) {
            // Remove modal
            const modal = document.getElementById('envSwitchModal');
            if (modal) {
                modal.remove();
            }
            
            setLoading(true);
            
            try {
                const response = await fetch(`${API_BASE}/set_environment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        environment: envId
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentEnvironment = envId;
                    
                    // Clear chat container
                    chatContainer.innerHTML = '';
                    
                    // Clear advice messages
                    adviceMessages = [];
                    adviceMessagesContainer.innerHTML = '';
                    
                    // Handle maze visualization
                    if (envId === 'maze') {
                        startMazeStatePolling();
                    } else {
                        stopMazeStatePolling();
                    }
                    
                    // Show success message
                    // addMessage('assistant', `Environment switched to ${data.message.split(' to ')[1]}. How can I help you?`);
                } else {
                    addMessage('assistant', `Error switching environment: ${data.error}`);
                    // Reset dropdown
                    environmentSelect.value = currentEnvironment;
                }
            } catch (error) {
                addMessage('assistant', `Error: ${error.message}`);
                // Reset dropdown
                environmentSelect.value = currentEnvironment;
            } finally {
                setLoading(false);
            }
        }

        function renderMazeGrid(state) {
            if (!state || !state.rooms) return;
            
            // Get all rooms with their positions
            const rooms = Object.entries(state.rooms);
            
            // Calculate bounds for scaling
            let minX = Infinity, maxX = -Infinity;
            let minY = Infinity, maxY = -Infinity;
            
            rooms.forEach(([roomId, room]) => {
                if (room.x !== undefined && room.y !== undefined) {
                    minX = Math.min(minX, room.x);
                    maxX = Math.max(maxX, room.x);
                    minY = Math.min(minY, room.y);
                    maxY = Math.max(maxY, room.y);
                }
            });
            
            // Calculate scale and offset for positioning
            const cellSize = 50;
            const padding = 20;
            const rangeX = maxX - minX || 1;
            const rangeY = maxY - minY || 1;
            const containerWidth = mazeGridContainer.clientWidth || 300;
            const containerHeight = mazeGridContainer.clientHeight || 300;
            const scaleX = (containerWidth - 2 * padding) / Math.max(rangeX + 1, 1);
            const scaleY = (containerHeight - 2 * padding) / Math.max(rangeY + 1, 1);
            const scale = Math.min(scaleX, scaleY, cellSize * 1.5); // Limit max cell size
            const finalCellSize = Math.max(scale, 30); // Minimum cell size
            
            // Calculate total grid size needed
            const gridWidth = padding * 2 + (rangeX + 1) * finalCellSize;
            const gridHeight = padding * 2 + (rangeY + 1) * finalCellSize;
            
            mazeGridContainer.innerHTML = '';
            const grid = document.createElement('div');
            grid.className = 'maze-grid';
            grid.style.width = `${gridWidth}px`;
            grid.style.height = `${gridHeight}px`;
            
            rooms.forEach(([roomId, room]) => {
                if (room.x === undefined || room.y === undefined) return;
                
                const cell = document.createElement('div');
                const isCurrent = state.current_room === roomId;
                const isVisited = state.visited_rooms.includes(roomId);
                const hasItems = room && room.items && room.items.length > 0;
                
                // Calculate position
                const x = padding + (room.x - minX) * finalCellSize;
                const y = padding + (room.y - minY) * finalCellSize;
                
                cell.className = 'maze-cell';
                cell.style.width = `${finalCellSize}px`;
                cell.style.height = `${finalCellSize}px`;
                cell.style.left = `${x}px`;
                cell.style.top = `${y}px`;
                
                if (isCurrent) {
                    cell.classList.add('current');
                } else if (isVisited) {
                    cell.classList.add('visited');
                }
                
                // Room label
                const label = document.createElement('div');
                label.className = 'maze-cell-label';
                label.textContent = roomId;
                cell.appendChild(label);
                
                // Cell content
                const content = document.createElement('div');
                content.className = 'maze-cell-content';
                
                // Agent indicator
                if (isCurrent) {
                    const agent = document.createElement('div');
                    agent.className = 'maze-cell-agent';
                    agent.textContent = 'A';
                    content.appendChild(agent);
                }
                
                // Items
                if (hasItems) {
                    room.items.forEach(item => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'maze-cell-item';
                        itemDiv.textContent = item[0].toUpperCase(); // First letter
                        content.appendChild(itemDiv);
                    });
                }
                
                cell.appendChild(content);
                grid.appendChild(cell);
            });
            
            mazeGridContainer.appendChild(grid);
        }

        async         function updateMazeState(initializeInputs = false) {
            // Only show maze if current environment is maze
            if (currentEnvironment !== 'maze') {
                mazeVisualization.classList.remove('visible');
                mazeConfig.classList.remove('visible');
                const mazeTopContainer = document.getElementById('mazeTopContainer');
                if (mazeTopContainer) {
                    mazeTopContainer.classList.remove('visible');
                }
                return null;
            }
            
            try {
                const response = await fetch(`${API_BASE}/environment_state?chat_id=${chatId}`);
                const data = await response.json();
                
                if (data.has_state && data.state) {
                    const mazeTopContainer = document.getElementById('mazeTopContainer');
                    if (mazeTopContainer) {
                        mazeTopContainer.classList.add('visible');
                    }
                    mazeVisualization.classList.add('visible');
                    mazeConfig.classList.add('visible');
                    renderMazeGrid(data.state);
                    
                    // Initialize inputs only when requested (on first load or after regeneration)
                    if (initializeInputs) {
                        initializeMazeInputs(data.state);
                    }
                    
                    return data.state;
                } else {
                    mazeVisualization.classList.remove('visible');
                    mazeConfig.classList.remove('visible');
                    const mazeTopContainer = document.getElementById('mazeTopContainer');
                    if (mazeTopContainer) {
                        mazeTopContainer.classList.remove('visible');
                    }
                    return null;
                }
            } catch (error) {
                console.error('Error fetching maze state:', error);
                mazeVisualization.classList.remove('visible');
                mazeConfig.classList.remove('visible');
                const mazeTopContainer = document.getElementById('mazeTopContainer');
                if (mazeTopContainer) {
                    mazeTopContainer.classList.remove('visible');
                }
                return null;
            }
        }

        function initializeMazeInputs(state) {
            // Initialize input fields from maze state (only when first loaded)
            if (state && state.num_rooms) {
                numRoomsInput.value = state.num_rooms;
            }
            if (state && state.seed !== undefined) {
                seedInput.value = state.seed || '';
            }
        }

        function startMazeStatePolling() {
            if (mazeStateInterval) {
                clearInterval(mazeStateInterval);
            }
            // Poll every 500ms (without initializing inputs)
            mazeStateInterval = setInterval(() => updateMazeState(false), 500);
            // Initial update - initialize inputs on first load
            updateMazeState(true);
        }

        function stopMazeStatePolling() {
            if (mazeStateInterval) {
                clearInterval(mazeStateInterval);
                mazeStateInterval = null;
            }
            if (currentEnvironment !== 'maze') {
                mazeVisualization.classList.remove('visible');
                mazeConfig.classList.remove('visible');
                const mazeTopContainer = document.getElementById('mazeTopContainer');
                if (mazeTopContainer) {
                    mazeTopContainer.classList.remove('visible');
                }
            }
        }

        async function loadEnvironments() {
            try {
                const response = await fetch(`${API_BASE}/environments`);
                const data = await response.json();
                availableEnvironments = data.environments;
                
                // Populate dropdown
                environmentSelect.innerHTML = '';
                availableEnvironments.forEach(env => {
                    const option = document.createElement('option');
                    option.value = env.id;
                    option.textContent = env.name;
                    if (env.id === currentEnvironment) {
                        option.selected = true;
                    }
                    environmentSelect.appendChild(option);
                });
                
                // Set up change handler
                environmentSelect.addEventListener('change', (e) => {
                    const newEnvId = e.target.value;
                    if (newEnvId !== currentEnvironment) {
                        const newEnv = availableEnvironments.find(env => env.id === newEnvId);
                        if (newEnv) {
                            showEnvironmentSwitchModal(newEnvId, newEnv.name);
                        }
                    }
                });
                
                // Initialize default environment on page load
                await initializeDefaultEnvironment();
                
                // Check if current environment is maze and start polling
                // This will fetch and display the maze state immediately
                if (currentEnvironment === 'maze') {
                    startMazeStatePolling();
                } else {
                    // Ensure maze section is hidden if not in maze environment
                    mazeVisualization.classList.remove('visible');
                    const mazeTopContainer = document.getElementById('mazeTopContainer');
                    if (mazeTopContainer) {
                        mazeTopContainer.classList.remove('visible');
                    }
                }
            } catch (error) {
                console.error('Error loading environments:', error);
            }
        }

        async function initializeDefaultEnvironment() {
            try {
                // Initialize the default environment (maze with 3 rooms) for the default chat_id
                const response = await fetch(`${API_BASE}/set_environment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        environment: currentEnvironment,
                        num_rooms: 3
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        console.log('Default environment initialized:', data.message);
                    }
                }
            } catch (error) {
                console.error('Error initializing default environment:', error);
            }
        }

        // Load environments on page load
        loadEnvironments();

        // Initial message
        // addMessage('assistant', 'Hello! I\'m a helpful assistant with file manipulation capabilities. How can I help you today?');
    </script>
</body>
